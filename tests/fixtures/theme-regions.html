<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Fixed landscape view</title>
<style>
  html { overflow: hidden; background: white; }
  body {
    position: fixed;
    inset: 0;
    margin: 0;
    overflow: hidden;
    background: #eee;
    color: #1c2633;
    font: 1rem system-ui, sans-serif;
  }
  main { position: absolute; inset: 0; }
  [role="region"] {
    background: white;
    width: 34%;
    height: 100%;
    padding: 1rem;
    box-sizing: border-box;
  }
  .accent { position: absolute; z-index: 2; top: 0; right: 0; width: 1rem; height: 1rem; background: #f3f3f3; }
  [data-variant="covered"] .cover {
    position: absolute; z-index: 1; inset: 0;
    background: white; pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    [data-variant]:not([data-variant="accent"]) [role="region"] { background: lab(7.78673 1.82345 -15.0537); }
    [data-variant="normal"] [role="region"] { color: white; }
    .accent { background: #111; }
  }
</style>
<script>
  document.documentElement.dataset.variant = new URLSearchParams(location.search).get('variant') ?? 'failing';
</script>
<main>
  <section role="region" aria-label="Current map results">
    <h1>Discover the landscape</h1>
    <p>Explore the places in view.</p>
  </section>
  <div class="cover"></div>
  <div class="accent" aria-hidden="true"></div>
</main>
</html>
